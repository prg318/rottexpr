name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4
    - uses: libsdl-org/setup-sdl@main
      with:
      install-linux-dependencies: true
      version: 2-latest
    - name: make
      run: make -C src
